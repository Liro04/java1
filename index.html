<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
      <title>Java 1 </title>
      </head>
      <body>
      <h1>Mire se vini</h1>
      <p> Kjo eshte fqja ime e par ne GIthub Pages..</p>


        <label>Numri Par</label>
        <input type="number" id="nr1">
        <br>
        <label>Numri i Dyt</label>
        <input type="number" id="nr2">
        <br>
        <button  type="submit"onclick="sum()">Shuma</button>
        <p id ="result" ></p>


        <script>
          function sum()
          {
            var a=Number(document.getElementById('nr1').value);
            var b=Number(document.getElementById('nr2').value);
            var c=a+b;
            document.GetElemenyById('result').innerHTML=c;
            
          }
        </script>
      </body>
    

  </head>
