
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java 1</title>
</head>
<body>
    <h1>Mire se vini</h1>
    <p>Kjo eshte faqja ime e pare ne GitHub Pages.</p>

    <label for="nr1">Numri i pare:</label>
    <input type="number" id="nr1">
    <br><br>

    <label for="nr2">Numri i dyte:</label>
    <input type="number" id="nr2">
    <br><br>

    <button type="button" onclick="sum()">Shuma</button>
    <button type="button" onclick="sub()">Zbritje</button>
    <button type="button" onclick="shumezimi()">Shumezimi</button>
    <button type="button" onclick="pjestimi()">Pjestimi</button>

    <p id="result"></p>
    <br>
    <br>
        <h2>Ritje/zbritje te numrit</h2>
    <p id="numri">0</p>
    <button type="submit" onclick="rritje()">Rritje +</button>
    <button type="submit" onclick="Zbritje()">Zbritje -</button>
    <script>
        var n=0;
        function rritje(){
            n=n+1;
            document.GetElementById('numri').innerHTML=n;
        }
        function sum() {
            var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);

            var c = a + b;

            document.getElementById('result').textContent = c;
        }

        function sub() {
            var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);

            var c = a - b;

            document.getElementById('result').textContent = c;
        }

        function shumezimi() {
            var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);

            var c = a * b;

            document.getElementById('result').textContent = c;
        }

        function pjestimi() {
            var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);

            if (b === 0) {
                document.getElementById('result').textContent =
                    "Gabim: Pjestimi me zero nuk lejohet!";
            } else {
                var c = a / b;
                document.getElementById('result').textContent = c;
            }
        }
    </script>
</body>
</html>
